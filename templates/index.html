<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioPen!</title>
    <meta name="description" content="Audio">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Hello gang</h1>
    <div id="photobooth">
            <h3>Here's a little demo:</h3>
            <video id="video" autoplay playsinline></video>
            <button id="onBtn">Camera On</button>
            <button id="cameraBtn">Take a photo!</button>
            <canvas id="canvas"></canvas>
            <img src="imgs/placeholder.svg" id="photo" alt="Your photo will show up here"/>
            <button id="downloadBtn">Download your photo!</button>
    </div>
</body>
</html>
