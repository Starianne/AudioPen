<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioPen!</title>
    <meta name="description" content="Audio">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='index.js') }}" defer></script>

<body>
    <div class="banner">
        <h1>DURHACK'26: AUDIO PEN</h1>
    </div>
    <h2>What Is The Audio Pen?</h2>
    <p class="intro">The audio pen is a tool that senses changes, and will produce audio outputs in response to these changes.</p>
    <div id="photobooth">
            <h3>Here's a little demo:</h3>
            <video id="video" autoplay playsinline></video>
            <button id="onBtn">Camera On</button>
            <button id="cameraBtn">Take a photo!</button>
            <canvas id="canvas"></canvas>
            <img src="imgs/placeholder.svg" id="photo" alt="Your photo will show up here"/>

            <button id="generateMusicBtn" disabled>
                Generate Music 🎵
            </button>

            <button id="stopMusicBtn">
                Stop Music ⏹
            </button>
    </div>
