    <h1>DURHACK'26: AUDIO PEN</h1>
    <p>The audio pen is a tool that senses changes, and will produce audio outputs in response to these changes.</p>  
    </div>
    <h1>Hello gang</h1>
    <div>
        <tr>
            <th><button type="button">Activate Camera</button></th> 
            <canvas></canvas> 
    <!--Button used to record from users' camera-->
            <th><button type="button">Upload Image</button></th>  
            <canvas></canvas> 
    <!--Used to upload an image to the system-->

            <th><button type="button">Insert Database</button></th>
            <canvas></canvas> 
        </tr>

    <!--Used to insert a database into the system-->    
    <div id="photobooth">
            <h3>Here's a little demo:</h3>
            <video id="video" autoplay playsinline></video>
            <button id="onBtn">Camera On</button>

            <canvas id="canvas"></canvas>
            <img src="imgs/placeholder.svg" id="photo" alt="Your photo will show up here"/>

            <button id="generateMusicBtn" disabled>
                Generate Music 🎵
